name: init and plan infra with terraform on staging env - checkov verification and comment on pr if changes
on:
  pull_request:
    branches: [main]
    paths: ['infra/envs/staging/**', 'infra/modules/**']

env:
  TF_VERSION: '1.10.0'

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with: { directory: infra/envs/staging }
  
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest

    # These permissions are needed for the GitHub token
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # nedeed for github to genrate the oicd token

    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check
        working-directory: infra/envs/staging
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init
        working-directory: infra/envs/staging

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
        working-directory: infra/envs/staging

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false 
        working-directory: infra/envs/staging
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v9
        env:
          TF_PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const plan = (process.env.TF_PLAN || '').slice(0, 60000); // GitHub comment limit is 65536 characters, leaving some room for the rest of the comment
            const output = [
              '#### Terraform Format and Style 🖌 `' + '${{ steps.fmt.outcome }}' + '`',
              '#### Terraform Initialization ⚙️ `' + '${{ steps.init.outcome }}' + '`',
              '#### Terraform Validation 🤖 `' + '${{ steps.validate.outcome }}' + '`',
              '#### Terraform Plan 📖 `' + '${{ steps.plan.outcome }}' + '`',
              '',
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              '*Pushed by: @${{ github.actor }}, Action: `${{ github.event_name }}`*'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

