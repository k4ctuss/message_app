name: cd Prod
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (ex: v1.2.3)'
        required: true 

env:
  TF_VERSION: '1.10.0'

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # nedeed for github to genrate the oicd token
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}   # checkout tag's commit

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init
        working-directory: infra/envs/prod

      - run: terraform plan -out=tfplan
        working-directory: infra/envs/prod
        
      - run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY" 
        working-directory: infra/envs/prod

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: infra/envs/prod/tfplan
      
  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production # triggered waiting for approval, let the time to review the plan (only available on public repo - can be replace by an action waiting a comment in a dedicate issue)
    permissions:
      id-token: write   # nedeed for github to genrate the oicd token
      contents: read
    outputs:
      instance_id: ${{ steps.tf-out.outputs.instance_id }}
      db_endpoint: ${{ steps.tf-out.outputs.db_endpoint }}
      db_name: ${{ steps.tf-out.outputs.db_name }}
      db_secret_arn: ${{ steps.tf-out.outputs.db_secret_arn }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}   # checkout tag's commit
          
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init
        working-directory: infra/envs/prod

      - uses: actions/download-artifact@v8
        with: 
          name: tfplan
          path: infra/envs/prod

      - run: terraform apply tfplan
        working-directory: infra/envs/prod
    
      - id: tf-out
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "db_endpoint=$(terraform output -raw db_endpoint)" >> "$GITHUB_OUTPUT"
          echo "db_name=$(terraform output -raw db_name)" >> "$GITHUB_OUTPUT"
          echo "db_secret_arn=$(terraform output -raw db_secret_arn)" >> "$GITHUB_OUTPUT"
        working-directory: infra/envs/prod

  deploy:
    needs: apply
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # nedeed for github to genrate the oicd token
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}   # checkout tag's commit
          fetch-depth: 0 # to get full tags/historic
      - id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        run: echo "image_tag=sha-${{ steps.resolve.outputs.sha }}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Construire les paramètres SSM # Base64-pack the deploy script so SSM decodes and runs it with bash (not dash by default that failed on some syntax).
        run: |
          {
            printf 'export IMAGE_TAG=%q\n' "${{ steps.meta.outputs.image_tag }}"
            printf 'export ECR_REGISTRY=%q\n' "${{ steps.ecr.outputs.registry }}"
            printf 'export AWS_REGION=%q\n' "${{ vars.AWS_REGION }}"
            printf 'export DB_SECRET_ARN=%q\n' "${{ needs.apply.outputs.db_secret_arn }}"
            printf 'export DB_ENDPOINT=%q\n' "${{ needs.apply.outputs.db_endpoint }}"
            printf 'export DB_NAME=%q\n' "${{ needs.apply.outputs.db_name }}"
            printf 'export ENV_FILE=%q\n' "/etc/app/runtime.env"
            cat .github/workflows/scripts/blue_green.sh
          } > /tmp/payload.sh
           
          B64=$(base64 -w0 /tmp/payload.sh)
          jq -n --arg b64 "$B64" '{commands: [
            "echo \($b64) | base64 -d > /root/deploy.sh",
            "chmod 700 /root/deploy.sh",
            "bash /root/deploy.sh"
          ]}' > params.json
      - name: Déployer via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ needs.apply.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "blue_green deploy ${{ github.sha }}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.apply.outputs.instance_id }}"; then
            echo "Le script distant a échoué. Récupération des logs..."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.apply.outputs.instance_id }}" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              StandardOutputContent:StandardOutputContent,
              StandardErrorContent:StandardErrorContent
            }' \
            --output yaml

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.apply.outputs.instance_id }}" \
            --query 'Status' \
            --output text)

          test "$STATUS" = "Success"
