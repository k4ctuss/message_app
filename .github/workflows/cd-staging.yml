name: Continous deployement for staging environnement
on:
  push:
    branches: main
permissions:
  contents: read

env:
  TF_VERSION: '1.10.0'

jobs:
  terraform:
    runs-on: ubuntu-latest
    outputs:
      instance_id: ${{ steps.tf-out.outputs.instance_id }}
      db_endpoint: ${{ steps.tf-out.outputs.db_endpoint }}
      db_name: ${{ steps.tf-out.outputs.db_name }}
      db_secret_arn: ${{ steps.tf-out.outputs.db_secret_arn }}
      app_url: ${{ steps.tf-out.outputs.app_url }}
    permissions:
      id-token: write   # nedeed for github to genrate the oicd token
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform init
        working-directory: infra/envs/staging
      - run: terraform apply -auto-approve
        working-directory: infra/envs/staging
      - id: tf-out
        run: |
          echo "instance_id=$(terraform output -raw instance_id)" >> "$GITHUB_OUTPUT"
          echo "db_endpoint=$(terraform output -raw db_endpoint)" >> "$GITHUB_OUTPUT"
          echo "db_name=$(terraform output -raw db_name)" >> "$GITHUB_OUTPUT"
          echo "db_secret_arn=$(terraform output -raw db_secret_arn)" >> "$GITHUB_OUTPUT"
          echo "app_url=$(terraform output -raw app_url)" >> "$GITHUB_OUTPUT"
        working-directory: infra/envs/staging

  build-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: meta
        run: echo "tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/messaging-app:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [terraform, build-push]
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # nedeed for github to genrate the oicd token
      contents: read

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/checkout@v7
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Construire les paramètres SSM
        run: |
          FULL_SCRIPT=$(
            {
              printf 'export IMAGE_TAG=%q\n' "${{ needs.build-push.outputs.image_tag }}"
              printf 'export ECR_REGISTRY=%q\n' "${{ steps.ecr.outputs.registry }}"
              printf 'export AWS_REGION=%q\n' "${{ vars.AWS_REGION }}"
              printf 'export DB_SECRET_ARN=%q\n' "${{ needs.terraform.outputs.db_secret_arn }}"
              printf 'export DB_ENDPOINT=%q\n' "${{ needs.terraform.outputs.db_endpoint }}"
              printf 'export DB_NAME=%q\n' "${{ needs.terraform.outputs.db_name }}"
              printf 'export ENV_FILE=%q\n' "/etc/app/runtime.env"
              cat .github/workflows/scripts/staging_deploy.sh
            }
          )
          jq -n --arg script "$FULL_SCRIPT" '{commands: [$script]}' > params.json

      - name: Déployer via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ needs.terraform.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "staging deploy ${{ github.sha }}" \
            --parameters file://params.json \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.terraform.outputs.instance_id }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ needs.terraform.outputs.instance_id }}"

  e2e-staging:
    needs: [terraform, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Wait for the public staging health endpoint
        env:
          APP_URL: ${{ needs.terraform.outputs.app_url }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$APP_URL/health"; then
              exit 0
            fi
            echo "Staging is not ready yet (attempt $attempt/30)."
            sleep 5
          done
          echo "Staging did not become ready in time."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Run Cypress against staging
        env:
          CYPRESS_BASE_URL: ${{ needs.terraform.outputs.app_url }}
          CYPRESS_API_URL: ${{ needs.terraform.outputs.app_url }}
        run: npx cypress run
        working-directory: frontend
