services:
    db:
        image: postgres:16
        profiles: ["db"]
        container_name: messaging-db
        environment:
            POSTGRES_DB: ${DB_NAME:-messaging_test}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-test}
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

    app:
        build: .
        profiles: ["app"]
        container_name: messaging-app
        environment:
            NODE_ENV: production
            PORT: ${PORT:-3000}
            TOKENSECRET: ${TOKENSECRET:-}
            DATABASE_URL: ${DATABASE_URL:-}
        depends_on:
            - db
        ports:
            - "3000:3000"

volumes:
    db_data:
