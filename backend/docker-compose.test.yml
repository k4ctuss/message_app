services:
  db-test:
    image: postgres:16-alpine   # même version que ton dev
    container_name: db-test
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"             # 5433 ± dev docker
    tmpfs:
      - /var/lib/postgresql/data  # no volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d app_test"]
      interval: 2s
      timeout: 3s
      retries: 20